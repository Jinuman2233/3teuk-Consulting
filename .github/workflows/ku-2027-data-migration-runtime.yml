              '815a43a3-8fb7-4ddc-a2f7-2e13a4ef68f7'::uuid
            );
            IF v_n <> 4 THEN
              RAISE EXCEPTION 'SUB81-84 missing rows';
            END IF;

            -- Composite ownership
            SELECT count(*) INTO v_n
            FROM public.document_submissions s
            JOIN public.required_documents d ON d.id = s.required_document_id
            WHERE d.admission_program_id IS DISTINCT FROM s.admission_program_id;
            IF v_n <> 0 THEN
