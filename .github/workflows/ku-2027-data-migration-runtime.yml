              FROM public.required_document_citations
              GROUP BY 1, 2
              HAVING count(*) > 1
            ) x;
            IF v_n <> 0 THEN
              RAISE EXCEPTION 'duplicate document citations';
            END IF;
            SELECT count(*) INTO v_n
            FROM (
              SELECT document_submission_id, source_citation_id
