name: KU 2027 Supabase Dry Run

on:
  push:
    branches:
      - test/ku-2027-supabase-dry-run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-dry-run:
    name: Hosted Supabase KU 2027 dry-run
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      EXPECTED_PROJECT_REF: styubtgvdjceulfurskb
      INITIAL_MIGRATION_VERSION: "20260825155343"
      KU_MIGRATION_VERSION: "20260905160000"
      KU_MIGRATION_FILE: supabase/migrations/20260905160000_load_ku_2027_reentry.sql
      KU_MIGRATION_BASENAME: 20260905160000_load_ku_2027_reentry.sql
      INITIAL_MIGRATION_BASENAME: 20260825155343_initial_schema.sql
      EXPECTED_KU_SHA256: a1214d772731aa53c0502f57086927fedc925b0b2f7d20ccce82c45b7c18c116
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Refuse forbidden workflow commands
        run: |
          set -euo pipefail
          workflow=".github/workflows/ku-2027-supabase-dry-run.yml"
          bad="$(grep -nE 'supabase[[:space:]]+db[[:space:]]+push' "$workflow" | grep -v -- '--dry-run' || true)"
          if [ -n "$bad" ]; then
            echo "Found a db push invocation without --dry-run"
            printf '%s\n' "$bad"
            exit 1
          fi
          if grep -nE 'supabase[[:space:]]+(migration[[:space:]]+repair|db[[:space:]]+reset|db[[:space:]]+pull|migration[[:space:]]+up)' "$workflow"; then
            echo "Found a forbidden Supabase mutation command"
            exit 1
          fi
          echo "Workflow command guard PASS"

      - name: Confirm expected project ref
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set"
            exit 1
          fi
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "SUPABASE_DB_PASSWORD is not set"
            exit 1
          fi
          if [ -z "${SUPABASE_PROJECT_ID:-}" ]; then
            echo "SUPABASE_PROJECT_ID is not set"
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_ID" != "$EXPECTED_PROJECT_REF" ]; then
            echo "Project reference mismatch"
            exit 1
          fi
          echo "Project ref matches expected development project: $EXPECTED_PROJECT_REF"

      - name: Confirm local migration inventory
        run: |
          set -euo pipefail
          mapfile -t migration_files < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)
          if [ "${#migration_files[@]}" -ne 2 ]; then
            echo "Expected exactly two local SQL migrations, found ${#migration_files[@]}"
            printf '%s\n' "${migration_files[@]}"
            exit 1
          fi
          if [ "${migration_files[0]}" != "supabase/migrations/20260825155343_initial_schema.sql" ]; then
            echo "Unexpected first migration: ${migration_files[0]}"
            exit 1
          fi
          if [ "${migration_files[1]}" != "$KU_MIGRATION_FILE" ]; then
            echo "Unexpected second migration: ${migration_files[1]}"
            exit 1
          fi
          echo "Local migrations:"
          printf '%s\n' "${migration_files[@]}"

      - name: Confirm KU migration SHA-256
        run: |
          set -euo pipefail
          actual="$(sha256sum "$KU_MIGRATION_FILE" | awk '{print $1}')"
          echo "expected SHA-256: $EXPECTED_KU_SHA256"
          echo "actual SHA-256:   $actual"
          if [ "$actual" != "$EXPECTED_KU_SHA256" ]; then
            echo "KU migration SHA-256 does not match runtime-tested SQL"
            exit 1
          fi
          echo "Migration SHA guard PASS"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.113.0

      - name: Print Supabase CLI version
        run: supabase --version

      - name: Ephemeral supabase init if needed
        run: |
          set -euo pipefail
          if [ -f supabase/config.toml ]; then
            echo "supabase/config.toml already present; skipping init"
          else
            supabase init
            echo "supabase init finished in CI working copy only"
          fi
          if [ ! -f "$KU_MIGRATION_FILE" ]; then
            echo "KU migration missing after init"
            exit 1
          fi
          actual="$(sha256sum "$KU_MIGRATION_FILE" | awk '{print $1}')"
          if [ "$actual" != "$EXPECTED_KU_SHA256" ]; then
            echo "KU migration SHA-256 changed after init"
            exit 1
          fi

      - name: Link hosted development project
        run: |
          set -euo pipefail
          pw=$(printf '%s' "$SUPABASE_DB_PASSWORD" | tr -d '\r')
          pw="${pw#"${pw%%[![:space:]]*}"}"
          pw="${pw%"${pw##*[![:space:]]}"}"
          if [ -z "$pw" ]; then
            echo "SUPABASE_DB_PASSWORD is empty after trimming"
            exit 1
          fi
          supabase link --project-ref "$EXPECTED_PROJECT_REF" --password "$pw"
          echo "supabase link finished"

      - name: Migration list BEFORE dry-run
        run: |
          set -euo pipefail
          pw=$(printf '%s' "$SUPABASE_DB_PASSWORD" | tr -d '\r')
          pw="${pw#"${pw%%[![:space:]]*}"}"
          pw="${pw%"${pw##*[![:space:]]}"}"
          mkdir -p "$RUNNER_TEMP/ku2027-dry-run"
          set +e
          before_output="$(supabase migration list --linked --password "$pw" 2>&1)"
          before_status=$?
          set -e
          printf '%s\n' "$before_output"
          printf '%s\n' "$before_output" > "$RUNNER_TEMP/ku2027-dry-run/migration-list-before.txt"
          if [ "$before_status" -ne 0 ]; then
            echo "supabase migration list --linked failed before dry-run"
            exit "$before_status"
          fi
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import sys

          text = Path(os.environ["RUNNER_TEMP"], "ku2027-dry-run", "migration-list-before.txt").read_text()
          initial = os.environ["INITIAL_MIGRATION_VERSION"]
          ku = os.environ["KU_MIGRATION_VERSION"]
          versions = re.findall(r"\d{14}", text)
          initial_n = versions.count(initial)
          ku_n = versions.count(ku)
          unexpected = sorted(set(versions) - {initial, ku})
          print(f"{initial} occurrence: {initial_n}")
          print(f"{ku} occurrence: {ku_n}")
          if unexpected:
              print(f"unexpected migration versions: {unexpected}")
              print("B. migration history mismatch")
              sys.exit(1)
          if initial_n != 2 or ku_n != 1:
              print("B. migration history mismatch")
              print(f"expected {initial}=2 (local+remote) and {ku}=1 (local only)")
              sys.exit(1)
          print("BEFORE history: 20260825155343 local+remote, 20260905160000 local-only")
          PY

      - name: Dry-run pending KU migration only
        run: |
          set -euo pipefail
          pw=$(printf '%s' "$SUPABASE_DB_PASSWORD" | tr -d '\r')
          pw="${pw#"${pw%%[![:space:]]*}"}"
          pw="${pw%"${pw##*[![:space:]]}"}"
          set +e
          dry_run_output="$(
            supabase db push --dry-run --linked --password "$pw" 2>&1
          )"
          dry_run_status=$?
          set -e
          printf '%s\n' "$dry_run_output"
          printf '%s\n' "$dry_run_output" > "$RUNNER_TEMP/ku2027-dry-run/db-push-dry-run.txt"
          echo "dry-run exit code: ${dry_run_status}"
          if [ "$dry_run_status" -ne 0 ]; then
            echo "Supabase dry-run command failed"
            exit "$dry_run_status"
          fi
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import sys

          expected = os.environ["KU_MIGRATION_BASENAME"]
          initial = os.environ["INITIAL_MIGRATION_BASENAME"]
          text = Path(os.environ["RUNNER_TEMP"], "ku2027-dry-run", "db-push-dry-run.txt").read_text()
          pending = sorted(set(re.findall(r"(\d{14}_[A-Za-z0-9_]+\.sql)", text)))
          print(f"dry-run pending SQL files: {pending}")
          print(f"pending migration count: {len(pending)}")
          if initial in pending:
              print("Initial schema must not be pending")
              sys.exit(1)
          if len(pending) != 1 or pending[0] != expected:
              print("Pending migration set is not exactly the KU data migration")
              sys.exit(1)
          print(f"dry-run pending migration: {pending[0]}")
          print("Initial schema is not pending")
          PY

      - name: Migration list AFTER dry-run
        run: |
          set -euo pipefail
          pw=$(printf '%s' "$SUPABASE_DB_PASSWORD" | tr -d '\r')
          pw="${pw#"${pw%%[![:space:]]*}"}"
          pw="${pw%"${pw##*[![:space:]]}"}"
          set +e
          after_output="$(supabase migration list --linked --password "$pw" 2>&1)"
          after_status=$?
          set -e
          printf '%s\n' "$after_output"
          printf '%s\n' "$after_output" > "$RUNNER_TEMP/ku2027-dry-run/migration-list-after.txt"
          if [ "$after_status" -ne 0 ]; then
            echo "supabase migration list --linked failed after dry-run"
            exit "$after_status"
          fi
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import sys

          before = Path(os.environ["RUNNER_TEMP"], "ku2027-dry-run", "migration-list-before.txt").read_text()
          after = Path(os.environ["RUNNER_TEMP"], "ku2027-dry-run", "migration-list-after.txt").read_text()
          initial = os.environ["INITIAL_MIGRATION_VERSION"]
          ku = os.environ["KU_MIGRATION_VERSION"]

          def version_lines(text: str) -> list[str]:
              lines = []
              for raw in text.splitlines():
                  if re.search(r"\d{14}", raw):
                      lines.append(" ".join(raw.split()))
              return lines

          def counts(text: str) -> tuple[int, int, set[str]]:
              versions = re.findall(r"\d{14}", text)
              return versions.count(initial), versions.count(ku), set(versions) - {initial, ku}

          before_lines = version_lines(before)
          after_lines = version_lines(after)
          b_initial, b_ku, b_unexpected = counts(before)
          a_initial, a_ku, a_unexpected = counts(after)
          print(f"AFTER {initial} occurrence: {a_initial}")
          print(f"AFTER {ku} occurrence: {a_ku}")
          if b_unexpected or a_unexpected:
              print(f"unexpected versions before={sorted(b_unexpected)} after={sorted(a_unexpected)}")
              sys.exit(1)
          if a_initial != 2 or a_ku != 1:
              print("AFTER history is not local+remote / local-only")
              sys.exit(1)
          if before_lines != after_lines:
              print("BEFORE/AFTER migration version rows differ")
              print("BEFORE:")
              print("\n".join(before_lines))
              print("AFTER:")
              print("\n".join(after_lines))
              sys.exit(1)
          print("BEFORE/AFTER migration history unchanged")
          print("20260905160000 still not remote-applied")
          print("remote migration ledger unchanged")
          PY

      - name: Confirm KU migration SHA unchanged
        run: |
          set -euo pipefail
          actual="$(sha256sum "$KU_MIGRATION_FILE" | awk '{print $1}')"
          if [ "$actual" != "$EXPECTED_KU_SHA256" ]; then
            echo "KU migration SHA-256 changed during dry-run workflow"
            exit 1
          fi
          echo "Migration SQL unchanged: $actual"
          echo "A. Hosted Supabase migration dry-run PASS"
