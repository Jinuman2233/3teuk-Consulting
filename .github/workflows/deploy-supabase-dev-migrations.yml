name: Deploy Supabase Dev Migrations

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: Type the exact target Supabase development project ref. Must match the expected development project.
        required: true
        type: string
      expected_pending_manifest:
        description: "Comma-separated version=sha256 pairs expected to be pending. Example: 20260912123000=<64hex>,20260912123100=<64hex>"
        required: true
        type: string
      confirm_apply:
        description: Type APPLY exactly (case-sensitive) to confirm database mutation.
        required: true
        type: string

concurrency:
  group: supabase-dev-migrations
  cancel-in-progress: false

permissions:
  contents: read

# Manual apply of an operator-declared pending migration set to the development database.
# The observed pending set must exactly equal the versions in expected_pending_manifest.
# Each manifest pair also confirms the local migration file SHA-256.
# This workflow may only run from main.
# PostgreSQL explicit-transaction rollback probe: PASS (separate runtime test).
# Supabase CLI failure rollback semantics: NOT PROVEN.
# Do not assume this CLI run wraps the SQL files in one transaction.

jobs:
  deploy-dev-migrations:
    name: Deploy confirmed pending migrations to development
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
      EXPECTED_PENDING_MANIFEST: ${{ inputs.expected_pending_manifest }}
      CONFIRM_APPLY: ${{ inputs.confirm_apply }}
      EXPECTED_PROJECT_REF: styubtgvdjceulfurskb
      EXPECTED_CONFIRM_APPLY: APPLY
    steps:
      - name: Confirm this run is on main
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "This deployment workflow may only run from main."
            exit 1
          fi
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "This deployment workflow may only run from main."
            exit 1
          fi
          echo "main-only execution guard PASS"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Confirm secrets are present
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set"
            exit 1
          fi
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "SUPABASE_DB_PASSWORD is not set"
            exit 1
          fi
          if [ -z "${SUPABASE_PROJECT_ID:-}" ]; then
            echo "SUPABASE_PROJECT_ID is not set"
            exit 1
          fi
          echo "Required secrets are set"

      - name: Confirm project, expected pending manifest, and APPLY
        run: |
          set -euo pipefail
          if [ "$CONFIRM_PROJECT_REF" != "$EXPECTED_PROJECT_REF" ]; then
            echo "confirm_project_ref does not match the expected development project"
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_ID" != "$EXPECTED_PROJECT_REF" ]; then
            echo "Project reference mismatch"
            exit 1
          fi
          if [ "$CONFIRM_APPLY" != "$EXPECTED_CONFIRM_APPLY" ]; then
            echo "confirm_apply was not APPLY"
            exit 1
          fi
          python3 - <<'PY'
          import os
          import re
          import sys

          raw = os.environ.get("EXPECTED_PENDING_MANIFEST", "")
          parts = raw.split(",")
          pairs = []
          seen_versions = set()
          seen_pairs = set()
          for index, part in enumerate(parts):
              item = part.strip()
              if item == "":
                  print(f"expected_pending_manifest contains an empty item at position {index + 1}")
                  sys.exit(1)
              if item.count("=") != 1:
                  print(
                      "malformed expected_pending_manifest item "
                      f"{item!r} (expected <14-digit-version>=<64-hex-sha256>)"
                  )
                  sys.exit(1)
              version_raw, sha_raw = item.split("=", 1)
              version = version_raw.strip()
              sha_input = sha_raw.strip()
              if re.fullmatch(r"[0-9]{14}", version) is None:
                  print(
                      "malformed migration version "
                      f"{version!r} (each version must be exactly 14 digits)"
                  )
                  sys.exit(1)
              if re.fullmatch(r"[0-9a-fA-F]{64}", sha_input) is None:
                  print(
                      "malformed migration SHA-256 "
                      f"{sha_input!r} (each SHA must be exactly 64 hexadecimal characters)"
                  )
                  sys.exit(1)
              sha = sha_input.lower()
              pair = (version, sha)
              if version in seen_versions:
                  print(f"duplicate expected pending version: {version}")
                  sys.exit(1)
              if pair in seen_pairs:
                  print(f"duplicate expected pending pair: {version}={sha}")
                  sys.exit(1)
              seen_versions.add(version)
              seen_pairs.add(pair)
              pairs.append(pair)
          if not pairs:
              print("expected_pending_manifest produced no pairs")
              sys.exit(1)
          pairs.sort(key=lambda item: item[0])
          normalized_versions = ",".join(version for version, _sha in pairs)
          normalized_manifest = ",".join(f"{version}={sha}" for version, sha in pairs)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"EXPECTED_PENDING_VERSIONS_NORMALIZED={normalized_versions}\n")
              handle.write(f"EXPECTED_PENDING_MANIFEST_NORMALIZED={normalized_manifest}\n")
          print(f"Normalized expected pending versions: {normalized_versions}")
          print(f"Normalized expected pending manifest: {normalized_manifest}")
          PY
          echo "Project guard PASS"
          echo "APPLY confirmation PASS"
          echo "Expected pending manifest guard PASS"

      - name: Resolve the confirmed local migration files
        id: resolve_target
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import sys

          versions = os.environ["EXPECTED_PENDING_VERSIONS_NORMALIZED"].split(",")
          operator_pairs = {}
          for item in os.environ["EXPECTED_PENDING_MANIFEST_NORMALIZED"].split(","):
              version, sha = item.split("=", 1)
              operator_pairs[version] = sha
          if versions != sorted(operator_pairs):
              print("Derived expected versions do not match the operator manifest")
              sys.exit(1)
          migrations_dir = Path("supabase/migrations")
          files = []
          basenames = []
          sha_lines = []
          mismatches = []
          for version in versions:
              matches = sorted(migrations_dir.glob(f"{version}_*.sql"))
              files_only = [path for path in matches if path.is_file()]
              if len(files_only) == 0:
                  print(f"No local migration starts with {version}_")
                  sys.exit(1)
              if len(files_only) != 1:
                  print(
                      f"Expected exactly one local file for version {version}, "
                      f"found {len(files_only)}"
                  )
                  for path in files_only:
                      print(path)
                  sys.exit(1)
              target = files_only[0]
              if target != Path("supabase/migrations") / target.name:
                  print(f"Resolved path is not a plain repository migration path: {target}")
                  sys.exit(1)
              digest = hashlib.sha256(target.read_bytes()).hexdigest()
              expected_sha = operator_pairs[version]
              print(f"version: {version}")
              print(f"file: {target}")
              print(f"expected sha: {expected_sha}")
              print(f"actual sha:   {digest}")
              if digest != expected_sha:
                  mismatches.append(version)
              files.append(str(target))
              basenames.append(target.name)
              sha_lines.append(f"{version} {target.name} {digest}")
          if mismatches:
              print(
                  "Operator manifest SHA-256 does not match local file: "
                  + ",".join(mismatches)
              )
              sys.exit(1)

          env_path = Path(os.environ["GITHUB_ENV"])
          with env_path.open("a", encoding="utf-8") as handle:
              handle.write("TARGET_MIGRATION_FILES=" + ",".join(files) + "\n")
              handle.write("TARGET_MIGRATION_BASENAMES=" + ",".join(basenames) + "\n")

          manifest = Path(os.environ["RUNNER_TEMP"], "supabase-deploy")
          manifest.mkdir(parents=True, exist_ok=True)
          (manifest / "target-migration-sha256.txt").write_text(
              "\n".join(sha_lines) + "\n",
              encoding="utf-8",
          )
          print("Local file resolve PASS")
          print("Operator SHA-256 confirmation PASS")
          PY

      - name: Record resolved migration SHA-256 values
        run: |
          set -euo pipefail
          echo "Recorded SHA-256 values for the operator-declared pending set:"
          cat "$RUNNER_TEMP/supabase-deploy/target-migration-sha256.txt"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.113.0

      - name: Print Supabase CLI version
        run: supabase --version

      - name: Ephemeral supabase init if needed
        run: |
          set -euo pipefail
          if [ -f supabase/config.toml ]; then
            echo "supabase/config.toml already present; skipping init"
          else
            supabase init
            echo "supabase init finished in CI working copy only"
          fi
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import sys

          recorded = Path(os.environ["RUNNER_TEMP"], "supabase-deploy", "target-migration-sha256.txt")
          if not recorded.is_file():
              print("Target SHA-256 manifest missing after init")
              sys.exit(1)
          operator_pairs = {}
          for item in os.environ["EXPECTED_PENDING_MANIFEST_NORMALIZED"].split(","):
              version, sha = item.split("=", 1)
              operator_pairs[version] = sha
          for raw in recorded.read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line:
                  continue
              version, basename, recorded_sha = line.split(" ", 2)
              target = Path("supabase/migrations") / basename
              if not target.is_file():
                  print(f"Target migration missing after init: {target}")
                  sys.exit(1)
              if not target.name.startswith(f"{version}_"):
                  print(f"Target basename {basename} does not start with {version}_")
                  sys.exit(1)
              operator_sha = operator_pairs.get(version)
              if operator_sha is None:
                  print(f"Recorded version {version} is not in the operator manifest")
                  sys.exit(1)
              actual = hashlib.sha256(target.read_bytes()).hexdigest()
              print(f"version: {version}")
              print(f"operator sha: {operator_sha}")
              print(f"recorded sha: {recorded_sha}")
              print(f"actual sha:   {actual}")
              if recorded_sha != operator_sha:
                  print(f"Recorded SHA-256 drifted from operator manifest: {target}")
                  sys.exit(1)
              if actual != recorded_sha:
                  print(f"Target migration SHA-256 changed after init: {target}")
                  sys.exit(1)
          print("Post-init target file identity PASS")
          print("Operator SHA and intra-run rehash PASS")
          PY

      - name: Link hosted development project
        run: |
          set -euo pipefail
          pw=$(printf '%s' "$SUPABASE_DB_PASSWORD" | tr -d '\r')
          pw="${pw#"${pw%%[![:space:]]*}"}"
          pw="${pw%"${pw##*[![:space:]]}"}"
          if [ -z "$pw" ]; then
            echo "SUPABASE_DB_PASSWORD is empty after trimming"
            exit 1
          fi
          supabase link --project-ref "$EXPECTED_PROJECT_REF" --password "$pw"
          echo "supabase link finished"

      - name: Migration list BEFORE apply
        run: |
          set -euo pipefail
          pw=$(printf '%s' "$SUPABASE_DB_PASSWORD" | tr -d '\r')
          pw="${pw#"${pw%%[![:space:]]*}"}"
          pw="${pw%"${pw##*[![:space:]]}"}"
          mkdir -p "$RUNNER_TEMP/supabase-deploy"
          set +e
          before_output="$(supabase migration list --linked --password "$pw" 2>&1)"
          before_status=$?
          set -e
          printf '%s\n' "$before_output"
          printf '%s\n' "$before_output" > "$RUNNER_TEMP/supabase-deploy/migration-list-before.txt"
          if [ "$before_status" -ne 0 ]; then
            echo "supabase migration list --linked failed before apply"
            exit "$before_status"
          fi
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import sys

          expected = os.environ["EXPECTED_PENDING_VERSIONS_NORMALIZED"].split(",")
          text = Path(os.environ["RUNNER_TEMP"], "supabase-deploy", "migration-list-before.txt").read_text()

          def parse_sets(text: str):
              local = set()
              remote = set()
              decorative = set("-|─│┼+ ├┤┬┴┌┐└┘═║╔╗╚╝╠╣╦╩╬")
              for raw in text.splitlines():
                  line = raw.replace("`", "")
                  if "Local" in line and "Remote" in line:
                      continue
                  sep = "│" if "│" in line else ("|" if "|" in line else "")
                  if not sep:
                      continue
                  if set(line.strip()) <= decorative:
                      continue
                  cols = [c.strip() for c in line.split(sep)]
                  # Drop empty edge cells from box-drawing tables only.
                  # Keep a 2-column empty Local cell ("   | <remote-version>").
                  if cols and cols[0] == "" and len(cols) >= 3:
                      cols = cols[1:]
                  if cols and cols[-1] == "" and len(cols) >= 3:
                      cols = cols[:-1]
                  local_col = cols[0] if cols else ""
                  remote_col = cols[1] if len(cols) > 1 else ""
                  local.update(re.findall(r"(?<!\d)(\d{14})(?!\d)", local_col))
                  remote.update(re.findall(r"(?<!\d)(\d{14})(?!\d)", remote_col))
              return local, remote

          local, remote = parse_sets(text)
          pending = sorted(local - remote)
          remote_only = sorted(remote - local)
          already_applied = sorted(set(expected) & remote)
          missing_local = sorted(set(expected) - local)
          unexpected = sorted(set(pending) - set(expected))
          missing_pending = sorted(set(expected) - set(pending))
          print(f"local versions: {sorted(local)}")
          print(f"remote versions: {sorted(remote)}")
          print(f"pending versions: {pending}")
          print(f"expected pending versions: {expected}")
          print(f"remote-only versions: {remote_only}")
          if remote_only:
              print("Remote-only migration divergence; refusing to push")
              sys.exit(1)
          if not pending:
              print("No pending migration; refusing to push")
              sys.exit(1)
          if already_applied:
              print(
                  "Expected version is already remote-applied; refusing to push: "
                  + ",".join(already_applied)
              )
              sys.exit(1)
          if missing_local:
              print(
                  "Expected version is not present locally in migration list; refusing to push: "
                  + ",".join(missing_local)
              )
              sys.exit(1)
          if pending != expected:
              if unexpected:
                  print(
                      "Unexpected pending migration; refusing to push: "
                      + ",".join(unexpected)
                  )
              if missing_pending:
                  print(
                      "Expected pending migration is missing from the actual pending set: "
                      + ",".join(missing_pending)
                  )
              sys.exit(1)
          print("Exact pending-set PASS: " + ",".join(expected))
          PY

      - name: Mandatory preflight dry-run
        run: |
          set -euo pipefail
          pw=$(printf '%s' "$SUPABASE_DB_PASSWORD" | tr -d '\r')
          pw="${pw#"${pw%%[![:space:]]*}"}"
          pw="${pw%"${pw##*[![:space:]]}"}"
          set +e
          dry_run_output="$(
            supabase db push --dry-run --linked --password "$pw" 2>&1
          )"
          dry_run_status=$?
          set -e
          printf '%s\n' "$dry_run_output"
          printf '%s\n' "$dry_run_output" > "$RUNNER_TEMP/supabase-deploy/db-push-dry-run.txt"
          echo "dry-run exit code: ${dry_run_status}"
          if [ "$dry_run_status" -ne 0 ]; then
            echo "Supabase dry-run command failed; refusing to push"
            exit "$dry_run_status"
          fi
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import sys

          expected = os.environ["TARGET_MIGRATION_BASENAMES"].split(",")
          expected_versions = os.environ["EXPECTED_PENDING_VERSIONS_NORMALIZED"].split(",")
          text = Path(os.environ["RUNNER_TEMP"], "supabase-deploy", "db-push-dry-run.txt").read_text()
          pending = sorted(set(re.findall(r"(\d{14}_[A-Za-z0-9_]+\.sql)", text)))
          pending_versions = sorted({name[:14] for name in pending})
          print(f"dry-run pending SQL files: {pending}")
          print(f"dry-run pending versions: {pending_versions}")
          print(f"expected pending SQL files: {expected}")
          if pending != expected or pending_versions != expected_versions:
              print("Dry-run pending set is not exactly the confirmed expected pending set")
              sys.exit(1)
          print("Dry-run target verification PASS: " + ",".join(pending))
          PY

      - name: Reconfirm ledger is unchanged after dry-run
        run: |
          set -euo pipefail
          pw=$(printf '%s' "$SUPABASE_DB_PASSWORD" | tr -d '\r')
          pw="${pw#"${pw%%[![:space:]]*}"}"
          pw="${pw%"${pw##*[![:space:]]}"}"
          set +e
          mid_output="$(supabase migration list --linked --password "$pw" 2>&1)"
          mid_status=$?
          set -e
          printf '%s\n' "$mid_output"
          printf '%s\n' "$mid_output" > "$RUNNER_TEMP/supabase-deploy/migration-list-after-dry-run.txt"
          if [ "$mid_status" -ne 0 ]; then
            echo "supabase migration list --linked failed after dry-run"
            exit "$mid_status"
          fi
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import sys

          expected = os.environ["EXPECTED_PENDING_VERSIONS_NORMALIZED"].split(",")
          before = Path(os.environ["RUNNER_TEMP"], "supabase-deploy", "migration-list-before.txt").read_text()
          after = Path(os.environ["RUNNER_TEMP"], "supabase-deploy", "migration-list-after-dry-run.txt").read_text()

          def parse_sets(text: str):
              local = set()
              remote = set()
              decorative = set("-|─│┼+ ├┤┬┴┌┐└┘═║╔╗╚╝╠╣╦╩╬")
              for raw in text.splitlines():
                  line = raw.replace("`", "")
                  if "Local" in line and "Remote" in line:
                      continue
                  sep = "│" if "│" in line else ("|" if "|" in line else "")
                  if not sep:
                      continue
                  if set(line.strip()) <= decorative:
                      continue
                  cols = [c.strip() for c in line.split(sep)]
                  if cols and cols[0] == "" and len(cols) >= 3:
                      cols = cols[1:]
                  if cols and cols[-1] == "" and len(cols) >= 3:
                      cols = cols[:-1]
                  local_col = cols[0] if cols else ""
                  remote_col = cols[1] if len(cols) > 1 else ""
                  local.update(re.findall(r"(?<!\d)(\d{14})(?!\d)", local_col))
                  remote.update(re.findall(r"(?<!\d)(\d{14})(?!\d)", remote_col))
              return local, remote

          def version_lines(text: str):
              lines = []
              for raw in text.splitlines():
                  if re.search(r"(?<!\d)\d{14}(?!\d)", raw):
                      lines.append(" ".join(raw.split()))
              return lines

          local, remote = parse_sets(after)
          pending = sorted(local - remote)
          remote_only = sorted(remote - local)
          print(f"post-dry-run pending versions: {pending}")
          print(f"expected pending versions: {expected}")
          if remote_only:
              print("Remote-only divergence after dry-run; refusing to push")
              sys.exit(1)
          already_applied = sorted(set(expected) & remote)
          missing_local = sorted(set(expected) - local)
          if already_applied or missing_local or pending != expected:
              print("Declared pending set is no longer exactly the local-only pending set after dry-run")
              if already_applied:
                  print("already remote-applied: " + ",".join(already_applied))
              if missing_local:
                  print("missing locally: " + ",".join(missing_local))
              if pending != expected:
                  print(f"actual pending: {pending}")
              sys.exit(1)
          if version_lines(before) != version_lines(after):
              print("Dry-run changed migration ledger version rows; refusing to push")
              print("BEFORE:")
              print("\n".join(version_lines(before)))
              print("AFTER DRY-RUN:")
              print("\n".join(version_lines(after)))
              sys.exit(1)
          print("Pre-apply second ledger check PASS; remote ledger unchanged")
          PY

      - name: Apply the confirmed pending migrations
        run: |
          set -euo pipefail
          pw=$(printf '%s' "$SUPABASE_DB_PASSWORD" | tr -d '\r')
          pw="${pw#"${pw%%[![:space:]]*}"}"
          pw="${pw%"${pw##*[![:space:]]}"}"
          supabase db push --linked --password "$pw"
          echo "supabase db push --linked finished"

      - name: Migration list AFTER apply
        run: |
          set -euo pipefail
          pw=$(printf '%s' "$SUPABASE_DB_PASSWORD" | tr -d '\r')
          pw="${pw#"${pw%%[![:space:]]*}"}"
          pw="${pw%"${pw##*[![:space:]]}"}"
          set +e
          after_output="$(supabase migration list --linked --password "$pw" 2>&1)"
          after_status=$?
          set -e
          printf '%s\n' "$after_output"
          printf '%s\n' "$after_output" > "$RUNNER_TEMP/supabase-deploy/migration-list-after.txt"
          if [ "$after_status" -ne 0 ]; then
            echo "supabase migration list --linked failed after apply"
            exit "$after_status"
          fi
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import sys

          expected = os.environ["EXPECTED_PENDING_VERSIONS_NORMALIZED"].split(",")
          text = Path(os.environ["RUNNER_TEMP"], "supabase-deploy", "migration-list-after.txt").read_text()

          def parse_sets(text: str):
              local = set()
              remote = set()
              decorative = set("-|─│┼+ ├┤┬┴┌┐└┘═║╔╗╚╝╠╣╦╩╬")
              for raw in text.splitlines():
                  line = raw.replace("`", "")
                  if "Local" in line and "Remote" in line:
                      continue
                  sep = "│" if "│" in line else ("|" if "|" in line else "")
                  if not sep:
                      continue
                  if set(line.strip()) <= decorative:
                      continue
                  cols = [c.strip() for c in line.split(sep)]
                  if cols and cols[0] == "" and len(cols) >= 3:
                      cols = cols[1:]
                  if cols and cols[-1] == "" and len(cols) >= 3:
                      cols = cols[:-1]
                  local_col = cols[0] if cols else ""
                  remote_col = cols[1] if len(cols) > 1 else ""
                  local.update(re.findall(r"(?<!\d)(\d{14})(?!\d)", local_col))
                  remote.update(re.findall(r"(?<!\d)(\d{14})(?!\d)", remote_col))
              return local, remote

          local, remote = parse_sets(text)
          pending = sorted(local - remote)
          remote_only = sorted(remote - local)
          print(f"AFTER local versions: {sorted(local)}")
          print(f"AFTER remote versions: {sorted(remote)}")
          print(f"AFTER pending versions: {pending}")
          print(f"expected applied versions: {expected}")
          if remote_only:
              print("Remote-only divergence after apply")
              sys.exit(1)
          missing_local = sorted(set(expected) - local)
          missing_remote = sorted(set(expected) - remote)
          still_pending = sorted(set(expected) & set(pending))
          if missing_local or missing_remote:
              print("Confirmed migration is not local+remote after apply")
              if missing_local:
                  print("missing locally: " + ",".join(missing_local))
              if missing_remote:
                  print("missing remotely: " + ",".join(missing_remote))
              sys.exit(1)
          if still_pending:
              print(
                  "Expected version remains pending after apply: "
                  + ",".join(still_pending)
              )
              sys.exit(1)
          if pending:
              print(f"Expected pending count 0 after apply, found {pending}")
              sys.exit(1)
          print("Post-apply ledger verification PASS")
          print("All expected versions present on remote PASS")
          print("Pending count 0 PASS")
          PY
